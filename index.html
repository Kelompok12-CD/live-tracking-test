<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime GPS Tracker & RFID Checkpoint</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS & GPX Plugin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
  
  <script>
    // 1. Inisialisasi Peta Leaflet (Lokasi Default Purwokerto)
    const map = L.map('map').setView([-7.4061585, 109.2606522], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. Load File Rute GPX (Ganti Live_Tracking_TestCapstone12.gpx jika nama file di GitHub beda)
    new L.GPX('Live_Tracking_TestCapstone12.gpx', {
      async: true,
      marker_options: {
        startIconUrl: null,
        endIconUrl: null,
        shadowUrl: null
      },
      polyline_options: {
        color: '#0066ff',
        opacity: 0.8,
        weight: 5
      }
    }).on('loaded', function(e) {
      map.fitBounds(e.target.getBounds());
    }).addTo(map);

    // 3. Checkpoint Statis (Diambil langsung dari Waypoint GPX Anda)
    const checkpoints = [
      { lat: -7.414365, lng: 109.2566992, name: "CHECKPOINT 1" },
      { lat: -7.407115, lng: 109.2526569, name: "CHECKPOINT 2" },
      { lat: -7.4061568, lng: 109.2606452, name: "FINISH" }
    ];

    checkpoints.forEach(cp => {
      L.marker([cp.lat, cp.lng])
        .addTo(map)
        .bindPopup(`<b>${cp.name}</b>`);
    });

    // 4. Marker Real-Time Pelacak ESP32
    let trackerMarker = L.marker([0, 0]).addTo(map);

    // 5. Konfigurasi ThingSpeak
    const CHANNEL_ID = "3570005"; // MASUKKAN KODE ANGKA CHANNEL ID THINGSPEAK ANDA DI SINI

    async function fetchRealtimeGPS() {
      if (!CHANNEL_ID || CHANNEL_ID === "ID_CHANNEL_ANDA") return;

      try {
        const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`);
        const data = await response.json();

        if (data && data.field1 && data.field2) {
          const lat = parseFloat(data.field1);
          const lng = parseFloat(data.field2);
          const rfidUID = data.field3 || "Tidak ada tap";
          const newPos = [lat, lng];

          trackerMarker.setLatLng(newPos);
          trackerMarker.bindPopup(`
            <b>Status Tracker Hardware</b><br>
            <b>Lat:</b> ${lat}<br>
            <b>Lng:</b> ${lng}<br>
            <b>RFID UID:</b> <span style="color:red; font-weight:bold;">${rfidUID}</span>
          `).openPopup();
          
          map.panTo(newPos);
        }
      } catch (error) {
        console.error("Gagal mengambil data ThingSpeak:", error);
      }
    }

    setInterval(fetchRealtimeGPS, 15000);
    fetchRealtimeGPS();
  </script>
</body>
</html>
