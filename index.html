<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking Viewer - Bentang Jawa</title>
  
  <!-- Leaflet CSS dari CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { display: flex; overflow: hidden; }
    
    /* Layout: Sidebar & Peta */
    #sidebar {
      width: 320px;
      background: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }
    
    #map {
      flex: 1;
      height: 100vh;
      width: 100%;
      background-color: #e5e3df;
    }

    /* Sidebar Header */
    .sidebar-header {
      padding: 15px;
      background: #111116;
      border-bottom: 1px solid #333;
    }
    
    .sidebar-header h3 { margin: 0 0 5px 0; color: #ff4757; font-size: 18px; }
    .status-badge { font-size: 12px; color: #2ed573; font-weight: bold; }

    /* Daftar Peserta (Leaderboard) */
    .rider-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .rider-card {
      background: #2b2b36;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 4px solid #ff4757;
    }

    .rider-card:hover { background: #3a3a49; }
    .rider-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .rider-info { font-size: 12px; color: #a4b0be; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- Sidebar Penonton -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>BENTANG JAWA LIVE</h3>
      <span class="status-badge">● LIVE TRACKING ACTIVE</span>
    </div>
    
    <div class="rider-list" id="riderList">
      <!-- Card Peserta Di-generate Otomatis oleh JS -->
    </div>
  </div>

  <!-- Container Peta -->
  <div id="map"></div>

  <!-- Leaflet JS dari CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Inisialisasi Peta
      const map = L.map('map');

      // 2. Tile Layer Esri World Topo Map (Bebas Error 403 & Gratis)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      // 3. Garis Rute Event (Polyline Merah)
      const routeCoordinates = [
        [-6.1754, 106.8272], // Jakarta
        [-6.8915, 107.6107], // Bandung
        [-6.9932, 110.4203], // Semarang
        [-7.2575, 112.7521], // Surabaya
        [-8.2192, 114.3691]  // Banyuwangi
      ];

      const polyline = L.polyline(routeCoordinates, { color: '#ff4757', weight: 4, opacity: 0.8 }).addTo(map);
      map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

      // 4. Object Penyimpan Marker
      const riderMarkers = {};

      // 5. Fungsi Render Sidebar & Update Posisi Marker Peta
      function updateDashboard(ridersData) {
        const riderListContainer = document.getElementById('riderList');
        riderListContainer.innerHTML = '';

        ridersData.forEach(rider => {
          const latLng = [rider.lat, rider.lng];

          // UPDATE / CREATE MARKER PETA
          if (riderMarkers[rider.id]) {
            riderMarkers[rider.id].setLatLng(latLng);
            riderMarkers[rider.id].getPopup().setContent(`
              <b>#${rider.bib} ${rider.name}</b><br>
              Speed: ${rider.speed} km/h<br>
              Battery: ${rider.battery}%
            `);
          } else {
            riderMarkers[rider.id] = L.marker(latLng).addTo(map)
              .bindPopup(`
                <b>#${rider.bib} ${rider.name}</b><br>
                Speed: ${rider.speed} km/h<br>
                Battery: ${rider.battery}%
              `);
          }

          // RENDER CARD SIDEBAR
          const card = document.createElement('div');
          card.className = 'rider-card';
          card.innerHTML = `
            <div class="rider-name">#${rider.bib} - ${rider.name}</div>
            <div class="rider-info">
              <span>Spd: ${rider.speed} km/h</span>
              <span>Bat: ${rider.battery}%</span>
            </div>
          `;

          // Klik Card -> Camera FlyTo Peserta
          card.onclick = function() {
            map.flyTo(latLng, 13, { duration: 1.5 });
            riderMarkers[rider.id].openPopup();
          };

          riderListContainer.appendChild(card);
        });
      }

      // 6. SIMULASI DATA REAL-TIME
      function fetchLatestData() {
        const mockRiders = [
          { id: "R01", bib: "01", name: "Budi Santoso", lat: -6.5000 + (Math.random() * 0.03), lng: 107.2000 + (Math.random() * 0.03), speed: 27, battery: 88 },
          { id: "R02", bib: "05", name: "Siti Rahma", lat: -6.8915 + (Math.random() * 0.03), lng: 107.6107 + (Math.random() * 0.03), speed: 21, battery: 95 },
          { id: "R03", bib: "12", name: "Agus Pratama", lat: -6.9932 + (Math.random() * 0.03), lng: 110.4203 + (Math.random() * 0.03), speed: 30, battery: 64 }
        ];

        updateDashboard(mockRiders);
      }

      fetchLatestData();
      setInterval(fetchLatestData, 5000);

      setTimeout(() => { map.invalidateSize(); }, 300);
    });
  </script>

</body>
</html>
