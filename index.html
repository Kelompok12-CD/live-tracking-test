<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking Viewer - Ultra Endurance Event</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    /* Layout: Sidebar Penonton & Peta */
    #sidebar {
      width: 320px;
      background: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }
    
    #map {
      flex: 1;
      height: 100%;
    }

    /* Sidebar Header */
    .sidebar-header {
      padding: 15px;
      background: #111116;
      border-bottom: 1px solid #333;
    }
    
    .sidebar-header h3 { margin: 0 0 5px 0; color: #ff4757; font-size: 18px; }
    .status-badge { font-size: 12px; color: #2ed573; font-weight: bold; }

    /* Daftar Peserta (Leaderboard) */
    .rider-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .rider-card {
      background: #2b2b36;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 4px solid #ff4757;
    }

    .rider-card:hover { background: #3a3a49; }
    .rider-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .rider-info { font-size: 12px; color: #a4b0be; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- Sidebar Penonton -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>BENTANG JAWA LIVE</h3>
      <span class="status-badge">● LIVE TRACKING ACTIVE</span>
    </div>
    
    <div class="rider-list" id="riderList">
      <!-- Card Peserta Akan Di-generate Otomatis oleh JavaScript -->
    </div>
  </div>

  <!-- Container Peta -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Inisialisasi Peta
      const map = L.map('map');

      // 2. Tile Layer Esri World Topo Map (Gratis & Bebas Error)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      // 3. Garis Rute Event (Polyline)
      const routeCoordinates = [
        [-6.1754, 106.8272], // Jakarta
        [-6.8915, 107.6107], // Bandung
        [-6.9932, 110.4203], // Semarang
        [-7.2575, 112.7521], // Surabaya
        [-8.2192, 114.3691]  // Banyuwangi
      ];

      const polyline = L.polyline(routeCoordinates, { color: '#ff4757', weight: 4, opacity: 0.8 }).addTo(map);
      map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

      // 4. Object Penyimpan Marker
      const riderMarkers = {};

      // 5. Fungsi Render Sidebar & Update Posisi Marker Peta
      function updateDashboard(ridersData) {
        const riderListContainer = document.getElementById('riderList');
        riderListContainer.innerHTML = ''; // Clear list lama

        ridersData.forEach(rider => {
          const latLng = [rider.lat, rider.lng];

          // --- UPDATE/CREATE MARKER PETA ---
          if (riderMarkers[rider.id]) {
            riderMarkers[rider.id].setLatLng(latLng);
            riderMarkers[rider.id].getPopup().setContent(`
              <b>#${rider.bib} ${rider.name}</b><br>
              Speed: ${rider.speed} km/h<br>
              Last Update: Baru saja
            `);
          } else {
            riderMarkers[rider.id] = L.marker(latLng).addTo(map)
              .bindPopup(`
                <b>#${rider.bib} ${rider.name}</b><br>
                Speed: ${rider.speed} km/h<br>
                Last Update: Baru saja
              `);
